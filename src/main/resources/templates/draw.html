<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>휴가 쿠폰 추첨 - 추첨 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-header {
            background-color: #dc3545;
            color: white;
        }
        .btn-danger {
            background-color: #dc3545;
            border-color: #dc3545;
        }
        .btn-warning {
            background-color: #ffc107;
            border-color: #ffc107;
            color: #000;
        }
        .alert {
            margin-top: 1rem;
        }
        .lottery-result {
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            padding: 1rem;
            margin-bottom: 0.5rem;
            background-color: #f8f9fa;
        }
        .winner-item {
            border: 1px solid #28a745;
            border-radius: 0.375rem;
            padding: 0.75rem;
            margin-bottom: 0.5rem;
            background-color: #d4edda;
        }
        .admin-warning {
            background-color: #fff3cd;
            border: 1px solid #ffeaa7;
            border-radius: 0.375rem;
            padding: 1rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-10">
                <h1 class="text-center mb-4">🎲 휴가 쿠폰 추첨 관리</h1>
                
                <!-- 관리자 경고 -->
                <div class="admin-warning">
                    <h6 class="text-warning mb-2">⚠️ 관리자 전용 페이지</h6>
                    <p class="mb-0 small">이 페이지는 관리자만 사용할 수 있습니다. 추첨은 신중하게 진행해주세요.</p>
                </div>

                <!-- 추첨 상태 확인 -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">📊 추첨 상태 확인</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4">
                                <label for="statusCouponType" class="form-label">쿠폰 종류</label>
                                <select class="form-select" id="statusCouponType">
                                    <option value="ONE_DAY">1일 휴가</option>
                                    <option value="THREE_DAY">3일 휴가</option>
                                    <option value="FIVE_DAY">5일 휴가</option>
                                </select>
                            </div>
                            <div class="col-md-4 d-flex align-items-end">
                                <button type="button" class="btn btn-outline-primary" onclick="checkLotteryStatus()">상태 확인</button>
                            </div>
                            <div class="col-md-4 d-flex align-items-center">
                                <span id="lotteryStatus" class="badge bg-secondary">미확인</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 선택적 추첨 -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">🎯 선택적 추첨 실행</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <label for="selectiveCouponType" class="form-label">쿠폰 종류</label>
                                <select class="form-select" id="selectiveCouponType">
                                    <option value="ONE_DAY">1일 휴가</option>
                                    <option value="THREE_DAY">3일 휴가</option>
                                    <option value="FIVE_DAY">5일 휴가</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="winnerCount" class="form-label">당첨자 수</label>
                                <input type="number" class="form-control" id="winnerCount" min="1" max="100" value="1">
                            </div>
                        </div>
                        <div class="mt-3">
                            <button type="button" class="btn btn-danger" onclick="conductSelectiveLottery()">
                                🎲 선택적 추첨 실행
                            </button>
                            <small class="text-muted ms-2">특정 쿠폰 타입에 대해서만 추첨을 진행합니다.</small>
                        </div>
                    </div>
                </div>

                <!-- 일괄 추첨 -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">🎰 일괄 추첨 실행</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-4">
                                <label for="oneDayWinners" class="form-label">1일 휴가 당첨자 수</label>
                                <input type="number" class="form-control" id="oneDayWinners" min="0" max="100" value="5">
                            </div>
                            <div class="col-md-4">
                                <label for="threeDayWinners" class="form-label">3일 휴가 당첨자 수</label>
                                <input type="number" class="form-control" id="threeDayWinners" min="0" max="100" value="3">
                            </div>
                            <div class="col-md-4">
                                <label for="fiveDayWinners" class="form-label">5일 휴가 당첨자 수</label>
                                <input type="number" class="form-control" id="fiveDayWinners" min="0" max="100" value="1">
                            </div>
                        </div>
                        <div class="mt-3">
                            <button type="button" class="btn btn-warning" onclick="conductBatchLottery()">
                                🎰 일괄 추첨 실행
                            </button>
                            <small class="text-muted ms-2">모든 쿠폰 타입에 대해 한 번에 추첨을 진행합니다.</small>
                        </div>
                    </div>
                </div>

                <!-- 추첨 결과 -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">🏆 최근 추첨 결과</h5>
                    </div>
                    <div class="card-body">
                        <div id="lotteryResults">
                            <p class="text-muted">추첨을 실행하면 결과가 여기에 표시됩니다.</p>
                        </div>
                        <button type="button" class="btn btn-outline-primary" onclick="loadAllLotteryResults()">전체 결과 새로고침</button>
                    </div>
                </div>

                <!-- 당첨자 목록 -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">👥 당첨자 목록</h5>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label for="winnerCouponType" class="form-label">쿠폰 종류</label>
                                <select class="form-select" id="winnerCouponType">
                                    <option value="ONE_DAY">1일 휴가</option>
                                    <option value="THREE_DAY">3일 휴가</option>
                                    <option value="FIVE_DAY">5일 휴가</option>
                                </select>
                            </div>
                            <div class="col-md-6 d-flex align-items-end">
                                <button type="button" class="btn btn-outline-success" onclick="loadWinners()">당첨자 조회</button>
                            </div>
                        </div>
                        <div id="winnersList">
                            <p class="text-muted">쿠폰 종류를 선택하고 당첨자 조회를 클릭해주세요.</p>
                        </div>
                    </div>
                </div>

                <!-- 알림 메시지 -->
                <div id="alertContainer"></div>

                <!-- 네비게이션 -->
                <div class="text-center mt-4">
                    <a href="/enter" class="btn btn-outline-primary me-2">응모 페이지</a>
                    <a href="/winner" class="btn btn-outline-info">당첨자 조회</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // 알림 메시지 표시
        function showAlert(message, type = 'info') {
            const alertContainer = document.getElementById('alertContainer');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            alertContainer.appendChild(alertDiv);
            
            // 10초 후 자동 제거
            setTimeout(() => {
                if (alertDiv.parentNode) {
                    alertDiv.remove();
                }
            }, 10000);
        }

        // 추첨 상태 확인
        async function checkLotteryStatus() {
            const couponType = document.getElementById('statusCouponType').value;
            
            try {
                const response = await fetch(`/api/lottery/status?couponType=${couponType}`);
                const data = await response.json();
                
                const statusElement = document.getElementById('lotteryStatus');
                
                if (data.code === 'SUCCESS') {
                    if (data.data) {
                        statusElement.className = 'badge bg-success';
                        statusElement.textContent = '추첨 완료';
                    } else {
                        statusElement.className = 'badge bg-warning';
                        statusElement.textContent = '추첨 대기';
                    }
                    showAlert(`${getCouponTypeName(couponType)} 추첨 상태: ${data.data ? '완료' : '대기'}`, 'info');
                } else {
                    statusElement.className = 'badge bg-danger';
                    statusElement.textContent = '오류';
                    showAlert(`오류: ${data.message}`, 'danger');
                }
            } catch (error) {
                showAlert('서버 연결에 실패했습니다.', 'danger');
                console.error('Error:', error);
            }
        }

        // 선택적 추첨 실행
        async function conductSelectiveLottery() {
            const couponType = document.getElementById('selectiveCouponType').value;
            const winnerCount = document.getElementById('winnerCount').value;

            if (!winnerCount || winnerCount < 1) {
                showAlert('당첨자 수를 올바르게 입력해주세요.', 'warning');
                return;
            }

            if (!confirm(`정말로 ${getCouponTypeName(couponType)} ${winnerCount}명에 대해 추첨을 진행하시겠습니까?`)) {
                return;
            }

            try {
                const response = await fetch('/api/lottery/conduct', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `couponType=${couponType}&winnerCount=${winnerCount}`
                });
                
                const data = await response.json();
                
                if (data.code === 'SUCCESS') {
                    showAlert(`추첨이 완료되었습니다! 당첨자 ${data.data.winners.length}명`, 'success');
                    displayLotteryResult(data.data);
                    loadAllLotteryResults();
                } else {
                    showAlert(`오류: ${data.message}`, 'danger');
                }
            } catch (error) {
                showAlert('서버 연결에 실패했습니다.', 'danger');
                console.error('Error:', error);
            }
        }

        // 일괄 추첨 실행
        async function conductBatchLottery() {
            const oneDayWinners = document.getElementById('oneDayWinners').value;
            const threeDayWinners = document.getElementById('threeDayWinners').value;
            const fiveDayWinners = document.getElementById('fiveDayWinners').value;

            const totalWinners = parseInt(oneDayWinners) + parseInt(threeDayWinners) + parseInt(fiveDayWinners);
            
            if (totalWinners === 0) {
                showAlert('최소 1명 이상의 당첨자를 설정해주세요.', 'warning');
                return;
            }

            if (!confirm(`일괄 추첨을 진행하시겠습니까?\n- 1일 휴가: ${oneDayWinners}명\n- 3일 휴가: ${threeDayWinners}명\n- 5일 휴가: ${fiveDayWinners}명`)) {
                return;
            }

            try {
                const response = await fetch('/api/lottery/conduct-batch', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `oneDayWinners=${oneDayWinners}&threeDayWinners=${threeDayWinners}&fiveDayWinners=${fiveDayWinners}`
                });
                
                const data = await response.json();
                
                if (data.code === 'SUCCESS') {
                    let totalWinnersCount = 0;
                    data.data.forEach(result => {
                        totalWinnersCount += result.winners.length;
                    });
                    showAlert(`일괄 추첨이 완료되었습니다! 총 당첨자 ${totalWinnersCount}명`, 'success');
                    displayBatchLotteryResults(data.data);
                    loadAllLotteryResults();
                } else {
                    showAlert(`오류: ${data.message}`, 'danger');
                }
            } catch (error) {
                showAlert('서버 연결에 실패했습니다.', 'danger');
                console.error('Error:', error);
            }
        }

        // 추첨 결과 표시
        function displayLotteryResult(result) {
            const resultsContainer = document.getElementById('lotteryResults');
            const resultDiv = document.createElement('div');
            resultDiv.className = 'lottery-result';
            
            let winnersHtml = '';
            result.winners.forEach(winner => {
                winnersHtml += `<span class="badge bg-success me-1">${winner.phoneNumber}</span>`;
            });

            resultDiv.innerHTML = `
                <div class="row">
                    <div class="col-md-8">
                        <h6>${getCouponTypeName(result.couponType)} 추첨 결과</h6>
                        <p class="mb-1">당첨자 ${result.winners.length}명: ${winnersHtml}</p>
                        <small class="text-muted">추첨일: ${new Date(result.lotteryDate).toLocaleString('ko-KR')}</small>
                    </div>
                </div>
            `;
            
            resultsContainer.insertBefore(resultDiv, resultsContainer.firstChild);
        }

        // 일괄 추첨 결과 표시
        function displayBatchLotteryResults(results) {
            results.forEach(result => {
                displayLotteryResult(result);
            });
        }

        // 전체 추첨 결과 조회
        async function loadAllLotteryResults() {
            // 각 쿠폰 타입별로 추첨 결과 조회
            const couponTypes = ['ONE_DAY', 'THREE_DAY', 'FIVE_DAY'];
            const resultsContainer = document.getElementById('lotteryResults');
            
            let hasResults = false;
            let allResultsHtml = '';

            for (const couponType of couponTypes) {
                try {
                    const response = await fetch(`/api/lottery/winners?couponType=${couponType}`);
                    const data = await response.json();
                    
                    if (data.code === 'SUCCESS' && data.data.length > 0) {
                        hasResults = true;
                        let winnersHtml = '';
                        data.data.forEach(winner => {
                            winnersHtml += `<span class="badge bg-success me-1">${winner.phoneNumber}</span>`;
                        });

                        allResultsHtml += `
                            <div class="lottery-result">
                                <div class="row">
                                    <div class="col-md-8">
                                        <h6>${getCouponTypeName(couponType)} 당첨자</h6>
                                        <p class="mb-1">당첨자 ${data.data.length}명: ${winnersHtml}</p>
                                    </div>
                                </div>
                            </div>
                        `;
                    }
                } catch (error) {
                    console.error(`Error loading ${couponType} results:`, error);
                }
            }

            if (hasResults) {
                resultsContainer.innerHTML = allResultsHtml;
            } else {
                resultsContainer.innerHTML = '<p class="text-muted">추첨 결과가 없습니다.</p>';
            }
        }

        // 당첨자 목록 조회
        async function loadWinners() {
            const couponType = document.getElementById('winnerCouponType').value;
            
            try {
                const response = await fetch(`/api/lottery/winners?couponType=${couponType}`);
                const data = await response.json();
                
                const winnersContainer = document.getElementById('winnersList');
                
                if (data.code === 'SUCCESS' && data.data.length > 0) {
                    let winnersHtml = '';
                    data.data.forEach((winner, index) => {
                        winnersHtml += `
                            <div class="winner-item">
                                <div class="row align-items-center">
                                    <div class="col-md-8">
                                        <strong>${index + 1}. ${winner.phoneNumber}</strong>
                                        <br>
                                        <small class="text-muted">
                                            응모 ID: ${winner.entryId} | 
                                            사용 코인: ${winner.coinCount}개
                                        </small>
                                    </div>
                                    <div class="col-md-4 text-end">
                                        <span class="badge bg-success">당첨</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    winnersContainer.innerHTML = `
                        <h6>${getCouponTypeName(couponType)} 당첨자 목록 (총 ${data.data.length}명)</h6>
                        ${winnersHtml}
                    `;
                } else {
                    winnersContainer.innerHTML = `<p class="text-muted">${getCouponTypeName(couponType)} 당첨자가 없습니다.</p>`;
                }
            } catch (error) {
                showAlert('서버 연결에 실패했습니다.', 'danger');
                console.error('Error:', error);
            }
        }

        // 쿠폰 타입 이름 변환
        function getCouponTypeName(couponType) {
            switch (couponType) {
                case 'ONE_DAY': return '1일 휴가';
                case 'THREE_DAY': return '3일 휴가';
                case 'FIVE_DAY': return '5일 휴가';
                default: return couponType;
            }
        }

        // 페이지 로드 시 전체 추첨 결과 조회
        document.addEventListener('DOMContentLoaded', function() {
            loadAllLotteryResults();
        });
    </script>
</body>
</html>
