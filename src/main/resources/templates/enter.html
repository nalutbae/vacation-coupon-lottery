<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>휴가 쿠폰 추첨 - 응모하기</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card-header {
            background-color: #007bff;
            color: white;
        }
        .btn-primary {
            background-color: #007bff;
            border-color: #007bff;
        }
        .btn-success {
            background-color: #28a745;
            border-color: #28a745;
        }
        .btn-danger {
            background-color: #dc3545;
            border-color: #dc3545;
        }
        .alert {
            margin-top: 1rem;
        }
        .entry-item {
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            padding: 1rem;
            margin-bottom: 0.5rem;
            background-color: #f8f9fa;
        }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <h1 class="text-center mb-4">🎫 휴가 쿠폰 추첨 시스템</h1>
                
                <!-- 사용자 정보 입력 -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">📱 사용자 정보</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="phoneNumber" class="form-label">전화번호</label>
                            <input type="text" class="form-control" id="phoneNumber" placeholder="010-1234-5678" 
                                   pattern="010-\d{4}-\d{4}" title="010-0000-0000 형식으로 입력해주세요">
                        </div>
                        <button type="button" class="btn btn-primary" onclick="loadUserInfo()">정보 조회</button>
                    </div>
                </div>

                <!-- 코인 관리 -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">🪙 응모 코인 관리</h5>
                    </div>
                    <div class="card-body">
                        <div class="row align-items-center">
                            <div class="col-md-8">
                                <h6>보유 코인: <span id="coinCount" class="badge bg-primary">-</span>개</h6>
                                <small class="text-muted">누적 획득: <span id="totalAcquiredCoins">-</span>/3개</small>
                            </div>
                            <div class="col-md-4 text-end">
                                <button type="button" class="btn btn-success" id="acquireCoinBtn" onclick="acquireCoin()">코인 획득</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 응모하기 -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">🎯 휴가 쿠폰 응모</h5>
                    </div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-6">
                                <label for="couponType" class="form-label">쿠폰 종류</label>
                                <select class="form-select" id="couponType">
                                    <option value="ONE_DAY">1일 휴가</option>
                                    <option value="THREE_DAY">3일 휴가</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label for="coinAmount" class="form-label">사용할 코인 수</label>
                                <input type="number" class="form-control" id="coinAmount" min="1" max="3" value="1">
                            </div>
                        </div>
                        <div class="mt-3">
                            <button type="button" class="btn btn-primary" onclick="enterLottery()">응모하기</button>
                        </div>
                    </div>
                </div>

                <!-- 내 응모 현황 -->
                <div class="card mb-4">
                    <div class="card-header">
                        <h5 class="mb-0">📋 내 응모 현황</h5>
                    </div>
                    <div class="card-body">
                        <div id="myEntries">
                            <p class="text-muted">전화번호를 입력하고 정보 조회를 클릭해주세요.</p>
                        </div>
                        <button type="button" class="btn btn-outline-primary" onclick="loadMyEntries()">현황 새로고침</button>
                    </div>
                </div>

                <!-- 알림 메시지 -->
                <div id="alertContainer"></div>

                <!-- 네비게이션 -->
                <div class="text-center mt-4">
                    <a href="/draw" class="btn btn-outline-secondary me-2">추첨 관리</a>
                    <a href="/winner" class="btn btn-outline-info">당첨자 조회</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentPhoneNumber = '';

        // 알림 메시지 표시
        function showAlert(message, type = 'info') {
            const alertContainer = document.getElementById('alertContainer');
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type} alert-dismissible fade show`;
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            `;
            alertContainer.appendChild(alertDiv);
            
            // 5초 후 자동 제거
            setTimeout(() => {
                if (alertDiv.parentNode) {
                    alertDiv.remove();
                }
            }, 5000);
        }

        // 전화번호 유효성 검사
        function validatePhoneNumber(phoneNumber) {
            const pattern = /^010-\d{4}-\d{4}$/;
            return pattern.test(phoneNumber);
        }

        // 사용자 정보 조회
        async function loadUserInfo() {
            const phoneNumber = document.getElementById('phoneNumber').value.trim();
            
            if (!phoneNumber) {
                showAlert('전화번호를 입력해주세요.', 'warning');
                return;
            }
            
            if (!validatePhoneNumber(phoneNumber)) {
                showAlert('전화번호 형식이 올바르지 않습니다. (예: 010-1234-5678)', 'warning');
                return;
            }

            currentPhoneNumber = phoneNumber;
            
            try {
                // 코인 수량 조회
                const response = await fetch(`/api/coins/count?phoneNumber=${encodeURIComponent(phoneNumber)}`);
                const data = await response.json();
                
                if (data.code === 'SUCCESS') {
                    document.getElementById('coinCount').textContent = data.data;
                    // 사용자 정보 조회 시에는 누적 획득 코인 정보가 없으므로 별도 API 호출 필요
                    loadUserCumulativeInfo(phoneNumber);
                    showAlert('사용자 정보를 조회했습니다.', 'success');
                    loadMyEntries();
                } else if (response.status === 404) {
                    document.getElementById('coinCount').textContent = '0';
                    document.getElementById('totalAcquiredCoins').textContent = '0';
                    updateAcquireButtonState(0);
                    showAlert('새로운 사용자입니다. 코인을 획득해주세요.', 'info');
                } else {
                    showAlert(`오류: ${data.message}`, 'danger');
                }
            } catch (error) {
                showAlert('서버 연결에 실패했습니다.', 'danger');
                console.error('Error:', error);
            }
        }

        // 코인 획득
        async function acquireCoin() {
            if (!currentPhoneNumber) {
                showAlert('먼저 전화번호를 입력하고 정보 조회를 해주세요.', 'warning');
                return;
            }

            try {
                const response = await fetch('/api/coins/acquire', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `phoneNumber=${encodeURIComponent(currentPhoneNumber)}`
                });
                
                const data = await response.json();
                
                if (data.code === 'SUCCESS') {
                    document.getElementById('coinCount').textContent = data.data.coinCount;
                    document.getElementById('totalAcquiredCoins').textContent = data.data.totalAcquiredCoins;
                    
                    // 누적 획득 코인이 3개에 도달하면 버튼 비활성화
                    updateAcquireButtonState(data.data.totalAcquiredCoins);
                    
                    showAlert(`코인을 획득했습니다! (보유: ${data.data.coinCount}개, 누적: ${data.data.totalAcquiredCoins}/3개)`, 'success');
                } else {
                    showAlert(`오류: ${data.message}`, 'danger');
                }
            } catch (error) {
                showAlert('서버 연결에 실패했습니다.', 'danger');
                console.error('Error:', error);
            }
        }

        // 응모하기
        async function enterLottery() {
            if (!currentPhoneNumber) {
                showAlert('먼저 전화번호를 입력하고 정보 조회를 해주세요.', 'warning');
                return;
            }

            const couponType = document.getElementById('couponType').value;
            const coinAmount = document.getElementById('coinAmount').value;

            if (!coinAmount || coinAmount < 1) {
                showAlert('사용할 코인 수를 입력해주세요.', 'warning');
                return;
            }

            try {
                const response = await fetch('/api/coupons/enter', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `phoneNumber=${encodeURIComponent(currentPhoneNumber)}&couponType=${couponType}&coinCount=${coinAmount}`
                });
                
                const data = await response.json();
                
                if (data.code === 'SUCCESS') {
                    showAlert(`응모가 완료되었습니다! (응모 ID: ${data.data.entryId})`, 'success');
                    loadUserInfo(); // 코인 수량 업데이트
                    loadMyEntries(); // 응모 현황 업데이트
                } else {
                    showAlert(`오류: ${data.message}`, 'danger');
                }
            } catch (error) {
                showAlert('서버 연결에 실패했습니다.', 'danger');
                console.error('Error:', error);
            }
        }

        // 내 응모 현황 조회
        async function loadMyEntries() {
            if (!currentPhoneNumber) {
                return;
            }

            try {
                const response = await fetch(`/api/coupons/my-entries?phoneNumber=${encodeURIComponent(currentPhoneNumber)}`);
                const data = await response.json();
                
                const entriesContainer = document.getElementById('myEntries');
                
                if (data.code === 'SUCCESS' && data.data.length > 0) {
                    let entriesHtml = '';
                    data.data.forEach(entry => {
                        const statusBadge = entry.isActive ? 
                            '<span class="badge bg-success">활성</span>' : 
                            '<span class="badge bg-secondary">취소됨</span>';
                        
                        const cancelButton = entry.isActive ? 
                            `<button class="btn btn-sm btn-danger" onclick="cancelEntry(${entry.entryId})">취소</button>` : 
                            '';

                        entriesHtml += `
                            <div class="entry-item">
                                <div class="row align-items-center">
                                    <div class="col-md-8">
                                        <strong>${getCouponTypeName(entry.couponType)}</strong> ${statusBadge}
                                        <br>
                                        <small class="text-muted">
                                            응모 ID: ${entry.entryId} | 
                                            사용 코인: ${entry.coinCount}개 | 
                                            응모일: ${new Date(entry.entryTime).toLocaleString('ko-KR')}
                                        </small>
                                    </div>
                                    <div class="col-md-4 text-end">
                                        ${cancelButton}
                                    </div>
                                </div>
                            </div>
                        `;
                    });
                    entriesContainer.innerHTML = entriesHtml;
                } else {
                    entriesContainer.innerHTML = '<p class="text-muted">응모 내역이 없습니다.</p>';
                }
            } catch (error) {
                console.error('Error loading entries:', error);
            }
        }

        // 응모 취소
        async function cancelEntry(entryId) {
            if (!confirm('정말로 이 응모를 취소하시겠습니까?')) {
                return;
            }

            try {
                const response = await fetch('/api/coupons/cancel', {
                    method: 'DELETE',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: `phoneNumber=${encodeURIComponent(currentPhoneNumber)}&entryId=${entryId}`
                });
                
                const data = await response.json();
                
                if (data.code === 'SUCCESS') {
                    showAlert('응모가 취소되었습니다. 코인이 반환되었습니다.', 'success');
                    loadUserInfo(); // 코인 수량 업데이트
                    loadMyEntries(); // 응모 현황 업데이트
                } else {
                    showAlert(`오류: ${data.message}`, 'danger');
                }
            } catch (error) {
                showAlert('서버 연결에 실패했습니다.', 'danger');
                console.error('Error:', error);
            }
        }

        // 사용자 누적 코인 정보 조회 (새로운 API 사용)
        async function loadUserCumulativeInfo(phoneNumber) {
            try {
                const response = await fetch(`/api/status/user/coin-info?phoneNumber=${encodeURIComponent(phoneNumber)}`);
                const data = await response.json();
                
                if (data.code === 'SUCCESS') {
                    document.getElementById('coinCount').textContent = data.data.coinCount;
                    document.getElementById('totalAcquiredCoins').textContent = data.data.totalAcquiredCoins;
                    updateAcquireButtonState(data.data.totalAcquiredCoins);
                } else {
                    // 기본값으로 설정
                    document.getElementById('totalAcquiredCoins').textContent = '0';
                    updateAcquireButtonState(0);
                }
            } catch (error) {
                console.error('Error loading cumulative info:', error);
                // 기본값으로 설정
                document.getElementById('totalAcquiredCoins').textContent = '0';
                updateAcquireButtonState(0);
            }
        }

        // 코인 획득 버튼 상태 업데이트
        function updateAcquireButtonState(totalAcquiredCoins) {
            const acquireBtn = document.getElementById('acquireCoinBtn');
            if (totalAcquiredCoins >= 3) {
                acquireBtn.disabled = true;
                acquireBtn.textContent = '획득 완료';
                acquireBtn.classList.remove('btn-success');
                acquireBtn.classList.add('btn-secondary');
            } else {
                acquireBtn.disabled = false;
                acquireBtn.textContent = '코인 획득';
                acquireBtn.classList.remove('btn-secondary');
                acquireBtn.classList.add('btn-success');
            }
        }

        // 쿠폰 타입 이름 변환
        function getCouponTypeName(couponType) {
            switch (couponType) {
                case 'ONE_DAY': return '1일 휴가';
                case 'THREE_DAY': return '3일 휴가';
                default: return couponType;
            }
        }

        // 페이지 로드 시 전화번호 입력 필드에 포커스
        document.addEventListener('DOMContentLoaded', function() {
            document.getElementById('phoneNumber').focus();
        });
    </script>
</body>
</html>
