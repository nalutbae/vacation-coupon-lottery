# 테스트 환경 설정
spring:
  application:
    name: vacation-coupon-lottery-test
  
  # 메시지 설정 (한글 오류 메시지 - UTF-8 인코딩)
  messages:
    basename: messages
    encoding: UTF-8
    cache-duration: 0  # 테스트에서는 캐시 비활성화
  
  # H2 인메모리 데이터베이스 (테스트용)
  datasource:
    url: jdbc:h2:mem:vacation_lottery_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  # JPA 설정
  jpa:
    hibernate:
      ddl-auto: create-drop  # 테스트마다 스키마 재생성
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  # Liquibase 설정
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: true
    drop-first: true  # 테스트 시작 전 기존 스키마 삭제

# 로깅 설정 (테스트용)
logging:
  level:
    root: WARN
    com.kidaristudio.vacationcouponlottery: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN